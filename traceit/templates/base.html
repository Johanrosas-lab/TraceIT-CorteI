<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}TraceIT{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>
<nav class="navbar navbar-expand-lg bg-white border-bottom">
  <div class="container py-2">
    <a class="navbar-brand fw-semibold" href="{{ url_for('tickets.index') }}">TraceIT</a>
    <span class="navbar-text text-secondary d-none d-md-inline">Mesa de ayuda informática</span>
    <a class="btn btn-primary ms-auto" href="{{ url_for('tickets.create') }}">Nuevo ticket</a>
  </div>
</nav>
<main class="container py-4">
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, message in messages %}
      <div class="alert alert-{{ category }}" role="alert">{{ message }}</div>
    {% endfor %}
  {% endwith %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
